[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencpt"
version = "0.0.1"
description = "Open-source Python library for CPT (cone penetration test) data analysis and visualization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "jadinata", email = "jamesadinata@gmail.com" }]
keywords = ["cpt", "cone-penetration-test", "geotechnical", "soil"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/opencpt/opencpt-python"
Repository = "https://github.com/opencpt/opencpt-python"

[tool.hatch.build.targets.wheel]
packages = ["src/opencpt"]

[tool.hatch.build.targets.sdist]
include = ["src/opencpt", "README.md", "LICENSE"]
