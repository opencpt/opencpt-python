[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencpt"
dynamic = ["version"]
description = "Open-source Python library for CPT (cone penetration test) analysis: liquefaction triggering and shear wave velocity"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "jadinata", email = "jamesadinata@gmail.com" }]
keywords = ["cpt", "cone-penetration-test", "geotechnical", "soil"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pandas>=2",
  "openpyxl>=3",
  "ruff>=0.17",
  "pyright>=1.1",
  "pre-commit>=4",
]

[project.urls]
Homepage = "https://github.com/opencpt/opencpt-python"
Repository = "https://github.com/opencpt/opencpt-python"

[tool.hatch.version]
path = "src/opencpt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opencpt"]

[tool.hatch.build.targets.sdist]
include = ["src/opencpt", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "NPY", # numpy
]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]
exclude = ["tests"]
pythonVersion = "3.9"
